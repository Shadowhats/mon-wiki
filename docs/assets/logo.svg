<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ShadowHats logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fef00"/>
      <stop offset="100%" stop-color="#7ac400"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="url(#g)" filter="url(#glow)"/>
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle"
        font-family="'Fira Code', monospace" font-size="36" font-weight="900" fill="#0b0e14">S</text>
</svg>
